services:
  backend:
    build:
      context: ./backend
    container_name: geroads-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./geroads.db
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: geroads-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
